  <line x1="560" y1="400" x2="450" y2="400" stroke="#0a0a0a" stroke-width="0.5"/>

  <!-- Center circle ornament ring -->
  <circle cx="400" cy="400" r="35" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Dot ring around center -->
  <circle cx="400" cy="360" r="3" fill="#0a0a0a"/>
