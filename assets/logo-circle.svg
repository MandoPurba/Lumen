  <path d="M80,490 C100,470 130,460 150,470 C130,450 120,430 115,400 C100,420 85,450 80,490Z" fill="#ffffff"/>
  <circle cx="105" cy="350" r="6" fill="#c41e1e"/>
  <circle cx="105" cy="450" r="6" fill="#c41e1e"/>

