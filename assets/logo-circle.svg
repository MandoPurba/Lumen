  <circle cx="230" cy="645" r="6" fill="#c41e1e"/>

  <!-- Inner cross lines -->
  <line x1="400" y1="135" x2="400" y2="665" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="135" y1="400" x2="665" y2="400" stroke="#0a0a0a" stroke-width="3"/>

