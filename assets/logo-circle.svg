  <circle cx="372" cy="428" r="2.5" fill="#0a0a0a"/>
  <circle cx="428" cy="428" r="2.5" fill="#0a0a0a"/>
  <circle cx="386" cy="362" r="2" fill="#0a0a0a"/>
  <circle cx="414" cy="362" r="2" fill="#0a0a0a"/>
  <circle cx="386" cy="438" r="2" fill="#0a0a0a"/>
