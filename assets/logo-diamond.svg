    <path d="M450,588 C460,600 477,595 472,580 C466,590 456,593 450,588Z" fill="#0a0a0a"/>
  </g>

  <!-- Left corner ornament -->
  <g>
    <path d="M105,400 C150,360 200,350 230,372 C208,350 198,322 208,295 C175,328 142,358 105,400Z" fill="#0a0a0a"/>
    <path d="M105,400 C150,440 200,450 230,428 C208,450 198,478 208,505 C175,472 142,442 105,400Z" fill="#0a0a0a"/>
