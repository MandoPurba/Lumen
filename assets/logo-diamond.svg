    <path d="M212,450 C200,460 205,477 220,472 C210,466 207,456 212,450Z" fill="#0a0a0a"/>
  </g>

  <!-- Right corner ornament -->
  <g>
    <path d="M695,400 C650,360 600,350 570,372 C592,350 602,322 592,295 C625,328 658,358 695,400Z" fill="#0a0a0a"/>
    <path d="M695,400 C650,440 600,450 570,428 C592,450 602,478 592,505 C625,472 658,442 695,400Z" fill="#0a0a0a"/>
    <path d="M615,340 C635,350 652,335 642,318 C632,330 622,335 615,340Z" fill="#ffffff"/>
    <path d="M615,460 C635,450 652,465 642,482 C632,470 622,465 615,460Z" fill="#ffffff"/>
    <circle cx="640" cy="362" r="6" fill="#c41e1e"/>
    <circle cx="640" cy="438" r="6" fill="#c41e1e"/>
    <path d="M588,350 C600,340 595,323 580,328 C590,334 593,344 588,350Z" fill="#0a0a0a"/>
    <path d="M588,450 C600,460 595,477 580,472 C590,466 593,456 588,450Z" fill="#0a0a0a"/>
  </g>

  <!-- Red accent triangles at diamond tips (in black border area) -->
  <polygon points="400,55 408,72 392,72" fill="#c41e1e"/>
  <polygon points="400,745 408,728 392,728" fill="#c41e1e"/>
  <polygon points="55,400 72,392 72,408" fill="#c41e1e"/>
  <polygon points="745,400 728,392 728,408" fill="#c41e1e"/>
</svg>
