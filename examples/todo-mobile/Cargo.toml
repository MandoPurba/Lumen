[package]
name = "todo-mobile"
version = "0.0.1"
edition.workspace = true
publish = false

[lib]
name = "todo_mobile"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "todo-mobile"
path = "src/main.rs"

[dependencies]
kireiui = { path = "../../crates/kireiui", features = ["android"] }
kireidata = { path = "../../crates/kireidata" }
kireiui-theme = { path = "../../crates/kireiui-theme" }
kireiui-widgets = { path = "../../crates/kireiui-widgets" }
