[package]
name = "todo-mobile"
version = "0.0.1"
edition.workspace = true
publish = false

[lib]
name = "todo_mobile"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "todo-mobile"
path = "src/main.rs"

[dependencies]
sihora = { path = "../../crates/sihora", features = ["android"] }
sihora-data = { path = "../../crates/sihora-data" }
sihora-theme = { path = "../../crates/sihora-theme" }
sihora-widgets = { path = "../../crates/sihora-widgets" }
