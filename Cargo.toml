[workspace]
resolver = "2"
members = [
    "crates/lumen",
    "crates/lumen-core",
    "crates/lumen-layout",
    "crates/lumen-primitives",
    "crates/lumen-render",
    "crates/lumen-text",
    "crates/lumen-platform",
    "examples/shapes",
    "examples/text",
    "examples/counter",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicepkg/lumen"
rust-version = "1.97"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-layout = { path = "crates/lumen-layout" }
lumen-primitives = { path = "crates/lumen-primitives" }
lumen-render = { path = "crates/lumen-render" }
lumen-text = { path = "crates/lumen-text" }
lumen-platform = { path = "crates/lumen-platform" }
cosmic-text = "0.12"
slotmap = "1"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
