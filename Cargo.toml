[workspace]
resolver = "2"
members = [
    "crates/lumen",
    "crates/lumen-core",
    "crates/lumen-layout",
    "crates/lumen-primitives",
    "crates/lumen-render",
    "crates/lumen-text",
    "crates/lumen-theme",
    "crates/lumen-widgets",
    "crates/lumen-data",
    "crates/lumen-data-derive",
    "crates/lumen-platform",
    "examples/shapes",
    "examples/text",
    "examples/counter",
    "examples/todo",
    "examples/gallery",
    "examples/todo-db",
    "examples/todo-mobile",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MandoPurba/Lumen"
rust-version = "1.97"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core", version = "0.1.0" }
lumen-layout = { path = "crates/lumen-layout", version = "0.1.0" }
lumen-primitives = { path = "crates/lumen-primitives", version = "0.1.0" }
lumen-render = { path = "crates/lumen-render", version = "0.1.0" }
lumen-text = { path = "crates/lumen-text", version = "0.1.0" }
lumen-data = { path = "crates/lumen-data", version = "0.1.0" }
lumen-data-derive = { path = "crates/lumen-data-derive", version = "0.1.0" }
lumen-theme = { path = "crates/lumen-theme", version = "0.1.0" }
lumen-widgets = { path = "crates/lumen-widgets", version = "0.1.0" }
lumen-platform = { path = "crates/lumen-platform", version = "0.1.0" }
cosmic-text = "0.12"
slotmap = "1"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
accesskit = "0.16"
accesskit_winit = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
