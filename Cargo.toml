[workspace]
resolver = "2"
members = [
    "crates/kireiui",
    "crates/kireiui-core",
    "crates/kireiui-layout",
    "crates/kireiui-primitives",
    "crates/kireiui-render",
    "crates/kireiui-text",
    "crates/kireiui-theme",
    "crates/kireiui-widgets",
    "crates/kireidata",
    "crates/kireidata-derive",
    "crates/kireiui-platform",
    "examples/shapes",
    "examples/text",
    "examples/counter",
    "examples/todo",
    "examples/gallery",
    "examples/todo-db",
    "examples/todo-mobile",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MandoPurba/Kirei"
rust-version = "1.97"

[workspace.dependencies]
kireiui-core = { path = "crates/kireiui-core", version = "0.1.0" }
kireiui-layout = { path = "crates/kireiui-layout", version = "0.1.0" }
kireiui-primitives = { path = "crates/kireiui-primitives", version = "0.1.0" }
kireiui-render = { path = "crates/kireiui-render", version = "0.1.0" }
kireiui-text = { path = "crates/kireiui-text", version = "0.1.0" }
kireidata = { path = "crates/kireidata", version = "0.1.0" }
kireidata-derive = { path = "crates/kireidata-derive", version = "0.1.0" }
kireiui-theme = { path = "crates/kireiui-theme", version = "0.1.0" }
kireiui-widgets = { path = "crates/kireiui-widgets", version = "0.1.0" }
kireiui-platform = { path = "crates/kireiui-platform", version = "0.1.0" }
cosmic-text = "0.12"
slotmap = "1"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
accesskit = "0.16"
accesskit_winit = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
