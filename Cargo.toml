[workspace]
resolver = "2"
members = [
    "crates/lumen",
    "crates/lumen-core",
    "crates/lumen-layout",
    "crates/lumen-primitives",
    "crates/lumen-render",
    "crates/lumen-text",
    "crates/lumen-theme",
    "crates/lumen-widgets",
    "crates/lumen-data",
    "crates/lumen-data-derive",
    "crates/lumen-platform",
    "examples/shapes",
    "examples/text",
    "examples/counter",
    "examples/todo",
    "examples/gallery",
    "examples/todo-db",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicepkg/lumen"
rust-version = "1.97"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-layout = { path = "crates/lumen-layout" }
lumen-primitives = { path = "crates/lumen-primitives" }
lumen-render = { path = "crates/lumen-render" }
lumen-text = { path = "crates/lumen-text" }
lumen-data = { path = "crates/lumen-data" }
lumen-data-derive = { path = "crates/lumen-data-derive" }
lumen-theme = { path = "crates/lumen-theme" }
lumen-widgets = { path = "crates/lumen-widgets" }
lumen-platform = { path = "crates/lumen-platform" }
cosmic-text = "0.12"
slotmap = "1"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
accesskit = "0.16"
accesskit_winit = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
