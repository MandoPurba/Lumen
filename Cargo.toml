[workspace]
resolver = "2"
members = [
    "crates/lumen",
    "crates/lumen-core",
    "crates/lumen-render",
    "crates/lumen-platform",
    "examples/shapes",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicepkg/lumen"
rust-version = "1.97"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-render = { path = "crates/lumen-render" }
lumen-platform = { path = "crates/lumen-platform" }
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
